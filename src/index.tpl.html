<script>
  // Si el motor 3D no carga (sin red o CDN bloqueado), mostrar un mensaje en lugar de una pantalla vacía.
  window.__cowBootTimer = setTimeout(function () {
    if (window.__cowBooted) return;
    var e = document.getElementById('boot-err');
    if (e) { e.hidden = false; e.textContent = 'No se pudo cargar el motor 3D (Three.js / cannon-es desde cdn.jsdelivr.net). Revisa tu conexión y recarga la página.'; }
    var m = document.getElementById('boot-msg'); if (m) m.textContent = 'ALGO SALIÓ MAL';
  }, 15000);
  window.addEventListener('error', function (ev) {
    if (window.__cowBooted) return;
    var e = document.getElementById('boot-err');
    if (e) { e.hidden = false; e.textContent = 'Error al iniciar: ' + (ev.message || ev.error); }
  });
</script>
