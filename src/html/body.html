<div id="app">
  <div id="gl"></div>
  <div id="fx-hurt"></div>
  <div id="fx-flash"></div>
  <div id="fx-daze"></div>
  <div id="hud" hidden>
    <div id="wounds" aria-hidden="true"><svg viewBox="0 0 40 92"><circle class="z zh" cx="20" cy="9" r="7.5"/><rect class="z zt" x="12" y="19" width="16" height="26" rx="4"/><rect class="z za" x="5" y="20" width="6" height="26" rx="3"/><rect class="z za" x="29" y="20" width="6" height="26" rx="3"/><rect class="z zl" x="12.5" y="47" width="6.5" height="40" rx="3"/><rect class="z zl" x="21" y="47" width="6.5" height="40" rx="3"/></svg></div>
    <canvas id="radar" width="176" height="176"></canvas>
    <canvas class="hud-pad" id="compass" width="520" height="40"></canvas>
    <div class="hud-pad" id="score"></div>
    <div class="hud-pad" id="killfeed"></div>
    <div class="hud-pad" id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
    <div class="hud-pad" id="hitmarker"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M24.28 24.91 L29.55 31.67 L31.67 29.55 L24.91 24.28Z M15.09 24.28 L8.33 29.55 L10.45 31.67 L15.72 24.91Z M15.72 15.09 L10.45 8.33 L8.33 10.45 L15.09 15.72Z M24.91 15.72 L31.67 10.45 L29.55 8.33 L24.28 15.09Z"/></svg></div>
    <div class="hud-pad" id="dmgdir"></div>
    <div class="hud-pad" id="scope" hidden></div>
    <div class="hud-pad" id="center-msg"></div>
    <!-- bajo la mira: avisos apilados (nunca se enciman) -->
    <div class="hud-pad" id="cstack"><div id="ahint"></div><div id="prompt" hidden></div><div id="plus"></div><div id="medals"></div></div>
    <div class="hud-pad" id="status"></div>
    <div class="hud-pad" id="weapon"></div>
    <div class="hud-pad" id="death" hidden></div>
    <div class="hud-pad" id="killcam" hidden><div class="bar top"><span class="rec">● KILLCAM</span><span class="skip"></span></div><div class="bar bot"><span id="kc-cap"></span></div></div>
    <div class="hud-pad" id="spectate" hidden></div>
    <div class="hud-pad" id="net-ind" hidden><i></i><span></span></div>
    <div class="hud-pad" id="fps" hidden></div>
  </div>
  <div id="dmgnums"></div>
  <div id="scoreboard" hidden></div>
  <div id="menu" hidden></div>
  <div id="overlay" hidden></div>
  <div id="tuning" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="errbox" hidden></div>
  <div id="boot">
    <div class="bootbox">
      <div class="logo"><span class="l1">CALL OF</span><span class="l2">WASHED</span></div>
      <p id="boot-msg">PREPARANDO EL DESPLIEGUE…</p>
      <div class="bar"><i></i></div>
      <div class="boot-err" id="boot-err" hidden></div>
    </div>
  </div>
</div>
